<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>⭐ 小勇士自律积分卡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --blue: #2B579A; --light-blue: #D6E4F0; --green: #70AD47; --light-green: #E2EFDA;
  --orange: #ED7D31; --light-orange: #FCE4D6; --purple: #7030A0; --light-purple: #E8DAEF;
  --gold: #FFD700; --light-gold: #FFF2CC; --red: #C00000; --gray: #f5f5f5;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 12px; color: #333; }
.container { max-width: 500px; margin: 0 auto; }

/* Header */
.header { text-align: center; padding: 20px 0 12px; color: white; }
.header h1 { font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
.header .subtitle { font-size: 13px; opacity: 0.9; margin-top: 4px; }

/* Lock Bar */
.lock-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 4px; }
.lock-btn { padding: 6px 16px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.5); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.lock-btn.locked { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); }
.lock-btn.unlocked { background: rgba(112,173,71,0.8); color: white; border-color: var(--green); }
.lock-btn:active { transform: scale(0.95); }
.lock-timer { font-size: 11px; color: rgba(255,255,255,0.6); }

/* Locked overlay effect */
body.view-mode .day-btn { pointer-events: none; }
body.view-mode .counter-btn { pointer-events: none; opacity: 0.4; }
body.view-mode .deduct-input-field { pointer-events: none; opacity: 0.5; }
body.view-mode .reset-bar { display: none; }
body.view-mode .redeem-btn.available { background: linear-gradient(135deg, var(--purple), #9B59B6); color: white; box-shadow: 0 2px 8px rgba(112,48,160,0.3); }

/* Password Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal { background: white; border-radius: 20px; padding: 28px 24px; width: 300px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: modalIn 0.3s ease; }
@keyframes modalIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h3 { font-size: 18px; color: var(--blue); margin-bottom: 6px; }
.modal p { font-size: 13px; color: #999; margin-bottom: 16px; }
.modal input { width: 100%; height: 44px; border: 2px solid #ddd; border-radius: 12px; text-align: center; font-size: 20px; letter-spacing: 8px; font-weight: 700; outline: none; transition: border-color 0.2s; }
.modal input:focus { border-color: var(--blue); }
.modal input.error { border-color: var(--red); animation: shake 0.4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.modal .btn-row { display: flex; gap: 10px; margin-top: 16px; }
.modal button { flex: 1; height: 40px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.modal .btn-cancel { background: #f0f0f0; color: #666; }
.modal .btn-confirm { background: var(--blue); color: white; }
.modal button:active { transform: scale(0.95); }
.modal .error-msg { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 18px; }

/* First-time setup */
.modal .setup-note { font-size: 12px; color: var(--green); margin-top: 8px; }

/* Week Navigation */
.week-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 12px 0; }
.week-nav button { background: rgba(255,255,255,0.25); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: all 0.2s; }
.week-nav button:active { transform: scale(0.9); background: rgba(255,255,255,0.4); }
.week-nav button:disabled { opacity: 0.3; }
.week-nav .week-label { color: white; font-size: 16px; font-weight: 600; min-width: 140px; text-align: center; }
.week-nav .date-range { color: rgba(255,255,255,0.8); font-size: 12px; }

/* Cards */
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.card-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

/* Balance Banner */
.balance-banner { background: linear-gradient(135deg, var(--gold), #FFA500); border-radius: 16px; padding: 16px; margin-bottom: 12px; text-align: center; box-shadow: 0 4px 15px rgba(255,165,0,0.3); }
.balance-banner .label { font-size: 13px; color: #333; font-weight: 600; }
.balance-banner .points { font-size: 40px; font-weight: 800; color: var(--red); text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.balance-banner .detail { font-size: 11px; color: #666; margin-top: 4px; }

/* Score Table */
.score-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.score-item:last-child { border-bottom: none; }
.score-item .icon { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
.score-item .info { flex: 1; min-width: 0; }
.score-item .name { font-size: 14px; font-weight: 600; }
.score-item .rule { font-size: 11px; color: #999; margin-top: 2px; }
.score-item .streak-info { font-size: 11px; color: var(--green); font-weight: 600; margin-top: 2px; }
.score-item .points-earned { font-size: 16px; font-weight: 700; color: var(--blue); min-width: 40px; text-align: right; margin-right: 8px; }

/* Day Buttons */
.days-row { display: flex; gap: 4px; margin-top: 8px; }
.day-btn { width: 40px; height: 40px; border-radius: 10px; border: 2px solid #ddd; background: white; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; position: relative; }
.day-btn.checked { border-color: var(--green); background: var(--light-green); }
.day-btn.checked::after { content: '✓'; position: absolute; top: -2px; right: -2px; background: var(--green); color: white; width: 14px; height: 14px; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; }
.day-btn .day-label { font-size: 8px; color: #999; line-height: 1.1; }
.day-btn .day-pts { font-size: 11px; font-weight: 700; color: var(--blue); }
.day-btn.checked .day-pts { color: var(--green); }

/* Counter Input */
.counter-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.counter-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--blue); background: white; color: var(--blue); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.counter-btn:active { transform: scale(0.9); background: var(--light-blue); }
.counter-val { font-size: 16px; font-weight: 700; min-width: 24px; text-align: center; }

/* Reward Cards */
.reward-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.reward-item:last-child { border-bottom: none; }
.reward-item .r-icon { font-size: 24px; width: 36px; text-align: center; flex-shrink: 0; }
.reward-item .r-info { flex: 1; }
.reward-item .r-name { font-size: 14px; font-weight: 600; }
.reward-item .r-cost { font-size: 12px; color: var(--purple); font-weight: 600; }
.redeem-btn { padding: 8px 16px; border-radius: 20px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.redeem-btn.available { background: linear-gradient(135deg, var(--purple), #9B59B6); color: white; box-shadow: 0 2px 8px rgba(112,48,160,0.3); }
.redeem-btn.available:active { transform: scale(0.95); }
.redeem-btn.unavailable { background: #eee; color: #bbb; }
.redeem-btn.redeemed { background: var(--light-purple); color: var(--purple); }

/* Summary */
.summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
.summary-row:last-child { border-bottom: none; }
.summary-row .s-label { font-size: 14px; color: #666; }
.summary-row .s-value { font-size: 18px; font-weight: 700; }
.s-value.positive { color: var(--green); }
.s-value.negative { color: var(--red); }
.s-value.neutral { color: var(--blue); }

/* Reset */
.reset-bar { text-align: center; padding: 20px 0 40px; }
.reset-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); padding: 8px 20px; border-radius: 20px; font-size: 12px; cursor: pointer; }
.reset-btn:active { background: rgba(255,0,0,0.3); }

/* Toast */
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(0,0,0,0.8); color: white; padding: 16px 24px; border-radius: 12px; font-size: 16px; z-index: 999; opacity: 0; transition: all 0.3s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* Confetti */
.confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 998; overflow: hidden; }
.confetti { position: absolute; width: 10px; height: 10px; top: -10px; animation: fall 3s ease-in forwards; }
@keyframes fall { to { top: 110vh; transform: rotate(720deg); } }
</style>
</head>
<body class="view-mode">
<div class="container" id="app">
  <div class="header">
    <h1>⭐ 小勇士自律积分卡 ⭐</h1>
    <div class="subtitle">每天进步一点点，积少成多变超人！💪</div>
  </div>
  
  <!-- Lock/Unlock Bar -->
  <div class="lock-bar">
    <button class="lock-btn locked" id="lockBtn" onclick="handleLockBtn()">
      <span id="lockIcon">🔒</span>
      <span id="lockText">家长解锁</span>
    </button>
    <span class="lock-timer" id="lockTimer"></span>
  </div>

  <div class="week-nav">
    <button id="prevWeek" onclick="changeWeek(-1)">‹</button>
    <div style="text-align:center">
      <div class="week-label" id="weekLabel">第1周</div>
      <div class="date-range" id="dateRange">3/9 - 3/15</div>
    </div>
    <button id="nextWeek" onclick="changeWeek(1)">›</button>
  </div>

  <div class="balance-banner">
    <div class="label">📦 当前可用积分</div>
    <div class="points" id="totalBalance">0</div>
    <div class="detail" id="balanceDetail">上周结余 0 + 本周净得 0 - 已兑换 0</div>
  </div>

  <div id="content"></div>

  <div class="reset-bar">
    <button class="reset-btn" onclick="confirmReset()">🔄 重置所有数据</button>
  </div>
</div>

<!-- Password Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">🔐 家长密码</h3>
    <p id="modalSubtitle">输入密码解锁编辑功能</p>
    <input type="password" id="pwdInput" maxlength="20" inputmode="numeric" placeholder="请输入密码" autocomplete="off">
    <div class="error-msg" id="errorMsg"></div>
    <div id="setupNote"></div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="submitPassword()">确认</button>
    </div>
  </div>
</div>

<!-- Confirm Dialog (no password) -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <h3 id="confirmTitle">确认</h3>
    <p id="confirmMsg" style="font-size:15px;color:#333;margin-bottom:16px"></p>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeConfirm()">再想想</button>
      <button class="btn-confirm" onclick="doConfirm()">确定！</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="confetti-container" id="confetti"></div>

<script>
// ===== PASSWORD / LOCK SYSTEM =====
const LOCK_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutes auto-lock
let isUnlocked = false;
let lockTimerId = null;
let lockCountdownId = null;
let lockDeadline = 0;
let modalMode = 'unlock'; // 'setup' | 'unlock' | 'change'

function getStoredHash() {
  return localStorage.getItem('reward_parent_pwd');
}

// Simple hash (not crypto-grade, but fine for kid-proofing)
async function hashPwd(pwd) {
  const enc = new TextEncoder().encode(pwd + 'reward_salt_2026');
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function handleLockBtn() {
  if (isUnlocked) {
    lockNow();
    return;
  }
  const stored = getStoredHash();
  if (!stored) {
    modalMode = 'setup';
    document.getElementById('modalTitle').textContent = '🔑 设置家长密码';
    document.getElementById('modalSubtitle').textContent = '首次使用，请设置一个密码（建议4-6位数字）';
    document.getElementById('setupNote').innerHTML = '<div class="setup-note">💡 密码仅保存在本设备，请牢记</div>';
  } else {
    modalMode = 'unlock';
    document.getElementById('modalTitle').textContent = '🔐 家长密码';
    document.getElementById('modalSubtitle').textContent = '输入密码解锁编辑功能';
    document.getElementById('setupNote').innerHTML = '';
  }
  document.getElementById('pwdInput').value = '';
  document.getElementById('errorMsg').textContent = '';
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(() => document.getElementById('pwdInput').focus(), 300);
}

async function submitPassword() {
  const pwd = document.getElementById('pwdInput').value.trim();
  if (!pwd) {
    document.getElementById('errorMsg').textContent = '请输入密码';
    return;
  }
  
  const hash = await hashPwd(pwd);
  
  if (modalMode === 'setup') {
    if (pwd.length < 4) {
      document.getElementById('errorMsg').textContent = '密码至少4位';
      return;
    }
    localStorage.setItem('reward_parent_pwd', hash);
    closeModal();
    unlock();
    showToast('✅ 密码设置成功，已解锁');
  } else {
    const stored = getStoredHash();
    if (hash === stored) {
      closeModal();
      if (modalMode === 'cancel' && pendingCancelId) {
        doCancelRedeem(pendingCancelWeek, pendingCancelId);
        pendingCancelWeek = null;
        pendingCancelId = null;
      } else {
        unlock();
        showToast('🔓 已解锁，10分钟后自动锁定');
      }
    } else {
      document.getElementById('errorMsg').textContent = '❌ 密码错误';
      document.getElementById('pwdInput').classList.add('error');
      setTimeout(() => document.getElementById('pwdInput').classList.remove('error'), 400);
      document.getElementById('pwdInput').value = '';
      document.getElementById('pwdInput').focus();
    }
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function unlock() {
  isUnlocked = true;
  document.body.classList.remove('view-mode');
  document.getElementById('lockBtn').className = 'lock-btn unlocked';
  document.getElementById('lockIcon').textContent = '🔓';
  document.getElementById('lockText').textContent = '点击锁定';
  
  // Set auto-lock timer
  lockDeadline = Date.now() + LOCK_TIMEOUT_MS;
  clearTimeout(lockTimerId);
  clearInterval(lockCountdownId);
  lockTimerId = setTimeout(lockNow, LOCK_TIMEOUT_MS);
  lockCountdownId = setInterval(updateCountdown, 1000);
  updateCountdown();
  render(); // Re-render to update interactive state
}

function lockNow() {
  isUnlocked = false;
  document.body.classList.add('view-mode');
  document.getElementById('lockBtn').className = 'lock-btn locked';
  document.getElementById('lockIcon').textContent = '🔒';
  document.getElementById('lockText').textContent = '家长解锁';
  document.getElementById('lockTimer').textContent = '';
  clearTimeout(lockTimerId);
  clearInterval(lockCountdownId);
  render(); // Re-render
  showToast('🔒 已锁定');
}

function updateCountdown() {
  const remaining = Math.max(0, lockDeadline - Date.now());
  if (remaining <= 0) {
    document.getElementById('lockTimer').textContent = '';
    return;
  }
  const min = Math.floor(remaining / 60000);
  const sec = Math.floor((remaining % 60000) / 1000);
  document.getElementById('lockTimer').textContent = `${min}:${sec.toString().padStart(2, '0')} 后锁定`;
}

// Enter key submits password
document.getElementById('pwdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});

// Click outside modal to close
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ===== CONFIRM DIALOG (no password) =====
let confirmCallback = null;

function showConfirmDialog(title, msg, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  confirmCallback = onConfirm;
  document.getElementById('confirmOverlay').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('show');
  confirmCallback = null;
}

function doConfirm() {
  document.getElementById('confirmOverlay').classList.remove('show');
  if (confirmCallback) {
    confirmCallback();
    confirmCallback = null;
  }
}

document.getElementById('confirmOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('confirmOverlay')) closeConfirm();
});

// ===== REWARD CHART LOGIC =====
const WEEKS = 4;
const START_DATE = new Date(2026, 2, 2);
const DAYS = ['一','二','三','四','五','六','日'];

function getDayDate(weekIdx, dayIdx) {
  const d = new Date(START_DATE.getTime() + (weekIdx * 7 + dayIdx) * 86400000);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

const SCORE_ITEMS = [
  { id: 'wash', icon: '🧼', name: '每天洗脸', rule: '逐天递加：连续第N天得N分', type: 'streak' },
  { id: 'homework', icon: '📝', name: '爸妈回来前写完作业', rule: '逐天递加：连续第N天得N分', type: 'streak' },
  { id: 'leave', icon: '🏃', name: '8点05分前出门', rule: '逐天递加：连续第N天得N分', type: 'streak' },
  { id: 'sleep', icon: '😴', name: '晚10点前睡觉', rule: '逐天递加：连续第N天得N分', type: 'streak' },
  { id: 'coding', icon: '💻', name: '核桃编程/体能课', rule: '每次 +2分', type: 'counter', pts: 2 },
  { id: 'oldclass', icon: '📚', name: '磕掉老课', rule: '每次 +5分', type: 'counter', pts: 5 },
  { id: 'story', icon: '📖', name: '读故事分享给爸妈', rule: '每次 +2分', type: 'counter', pts: 2 },
  { id: 'progress', icon: '✏️', name: '写字/算数明显进步', rule: '每次 +3分（爸妈认可）', type: 'counter', pts: 3 },
];

const REWARDS = [
  { id: 'game', icon: '🎮', name: '10分钟游戏', cost: 20, limit: '每周限1次', weeklyMax: 1 },
  { id: 'cartoon', icon: '📺', name: '看动画片1集', cost: 10 },
  { id: 'playtime', icon: '🎲', name: '爸妈专心陪玩30分钟', cost: 20 },
  { id: 'park', icon: '🌳', name: '爸妈带去公园1次', cost: 10 },
  { id: 'friend', icon: '👫', name: '约同学玩1次', cost: 30 },
  { id: 'dinner', icon: '🍜', name: '吃大餐1次', cost: 40 },
  { id: 'playground', icon: '🎢', name: '去游乐场1次', cost: 40 },
  { id: 'special', icon: '🏛️', name: '特别活动（博物馆等）', cost: 100 },
];

let currentWeek = 0;
let data = loadData();

function loadData() {
  try {
    const saved = localStorage.getItem('reward_chart_v2');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return initData();
}

function initData() {
  const d = { weeks: [] };
  for (let w = 0; w < WEEKS; w++) {
    const week = { scores: {}, deductions: Array(7).fill(0), redeemed: {} };
    SCORE_ITEMS.forEach(item => {
      if (item.type === 'streak') week.scores[item.id] = Array(7).fill(false);
      else week.scores[item.id] = 0;
    });
    d.weeks.push(week);
  }
  return d;
}

function saveData() {
  localStorage.setItem('reward_chart_v2', JSON.stringify(data));
}

function checkUnlocked() {
  if (!isUnlocked) {
    showToast('🔒 请先点击"家长解锁"');
    return false;
  }
  return true;
}

function getStreakPoints(checked, weekIdx, dayIdx) {
  let streak = 0;
  for (let w = weekIdx; w >= 0; w--) {
    const startDay = (w === weekIdx) ? dayIdx : 6;
    for (let d = startDay; d >= 0; d--) {
      if (w === weekIdx && d > dayIdx) continue;
      if (data.weeks[w].scores[checked][d]) streak++;
      else return streak;
    }
  }
  return streak;
}

function getItemWeekPoints(item, weekIdx) {
  const week = data.weeks[weekIdx];
  if (item.type === 'streak') {
    let total = 0;
    for (let d = 0; d < 7; d++) {
      if (week.scores[item.id][d]) {
        total += getStreakPoints(item.id, weekIdx, d);
      }
    }
    return total;
  }
  return week.scores[item.id] * item.pts;
}

function getWeekScoreTotal(weekIdx) {
  return SCORE_ITEMS.reduce((sum, item) => sum + getItemWeekPoints(item, weekIdx), 0);
}

function getWeekDeductTotal(weekIdx) {
  return data.weeks[weekIdx].deductions.reduce((a, b) => a + b, 0);
}

function getWeekRedeemTotal(weekIdx) {
  const redeemed = data.weeks[weekIdx].redeemed;
  let total = 0;
  REWARDS.forEach(r => { total += (redeemed[r.id] || 0) * r.cost; });
  return total;
}

function getCarryOver(weekIdx) {
  if (weekIdx === 0) return 0;
  return getBalanceEnd(weekIdx - 1);
}

function getBalanceEnd(weekIdx) {
  return getCarryOver(weekIdx) + getWeekScoreTotal(weekIdx) - getWeekDeductTotal(weekIdx) - getWeekRedeemTotal(weekIdx);
}

function getCurrentBalance() {
  return getBalanceEnd(currentWeek);
}

function changeWeek(delta) {
  currentWeek = Math.max(0, Math.min(WEEKS - 1, currentWeek + delta));
  render();
}

function toggleDay(itemId, dayIdx) {
  if (!checkUnlocked()) return;
  data.weeks[currentWeek].scores[itemId][dayIdx] = !data.weeks[currentWeek].scores[itemId][dayIdx];
  saveData();
  render();
  if (data.weeks[currentWeek].scores[itemId][dayIdx]) {
    const streak = getStreakPoints(itemId, currentWeek, dayIdx);
    if (streak >= 7) showToast('🔥 连续7天！太厉害了！');
    else if (streak >= 3) showToast(`⚡ 连续${streak}天！+${streak}分`);
  }
}

function changeCounter(itemId, delta) {
  if (!checkUnlocked()) return;
  const val = data.weeks[currentWeek].scores[itemId] + delta;
  if (val >= 0) {
    data.weeks[currentWeek].scores[itemId] = val;
    saveData();
    render();
  }
}

function updateDeduction(dayIdx, value) {
  if (!checkUnlocked()) return;
  const v = Math.max(0, parseInt(value) || 0);
  data.weeks[currentWeek].deductions[dayIdx] = v;
  saveData();
  render();
}

let pendingRedeemId = null;

function redeemReward(rewardId) {
  const reward = REWARDS.find(r => r.id === rewardId);
  const redeemed = data.weeks[currentWeek].redeemed;
  const count = redeemed[rewardId] || 0;
  const balance = getCurrentBalance();
  
  if (reward.weeklyMax && count >= reward.weeklyMax) {
    showToast('⚠️ 本周已达兑换上限');
    return;
  }
  if (balance < reward.cost) {
    showToast('😅 积分不够哦，继续加油！');
    return;
  }
  
  // 弹窗确认，防止误操作
  pendingRedeemId = rewardId;
  showConfirmDialog('🎁 确认兑换', `确定要用 ${reward.cost} 积分兑换「${reward.icon} ${reward.name}」吗？`, function() {
    doRedeem(pendingRedeemId);
    pendingRedeemId = null;
  });
}

function doRedeem(rewardId) {
  const reward = REWARDS.find(r => r.id === rewardId);
  const redeemed = data.weeks[currentWeek].redeemed;
  const count = redeemed[rewardId] || 0;
  redeemed[rewardId] = count + 1;
  saveData();
  render();
  showToast(`🎉 兑换成功！${reward.icon} ${reward.name}`);
  fireConfetti();
}

let pendingCancelWeek = null;
let pendingCancelId = null;

function cancelRedeem(weekIdx, rewardId) {
  const reward = REWARDS.find(r => r.id === rewardId);
  // 需要密码确认
  if (isUnlocked) {
    doCancelRedeem(weekIdx, rewardId);
  } else {
    pendingCancelWeek = weekIdx;
    pendingCancelId = rewardId;
    modalMode = 'cancel';
    document.getElementById('modalTitle').textContent = '↩️ 取消兑换';
    document.getElementById('modalSubtitle').textContent = `确认退回「${reward.icon} ${reward.name}」？积分将返还。请输入家长密码`;
    document.getElementById('setupNote').innerHTML = '';
    document.getElementById('pwdInput').value = '';
    document.getElementById('errorMsg').textContent = '';
    document.getElementById('modalOverlay').classList.add('show');
    setTimeout(() => document.getElementById('pwdInput').focus(), 300);
  }
}

function doCancelRedeem(weekIdx, rewardId) {
  const redeemed = data.weeks[weekIdx].redeemed;
  if ((redeemed[rewardId] || 0) > 0) {
    redeemed[rewardId]--;
    saveData();
    render();
    const reward = REWARDS.find(r => r.id === rewardId);
    showToast(`↩️ 已退回「${reward.icon} ${reward.name}」，+${reward.cost}积分`);
  }
}

function undoRedeem(rewardId) {
  cancelRedeem(currentWeek, rewardId);
}

function render() {
  // Week nav
  document.getElementById('weekLabel').textContent = `第${currentWeek + 1}周`;
  const ws = new Date(START_DATE.getTime() + currentWeek * 7 * 86400000);
  const we = new Date(ws.getTime() + 6 * 86400000);
  document.getElementById('dateRange').textContent = `${ws.getMonth()+1}/${ws.getDate()} - ${we.getMonth()+1}/${we.getDate()}`;
  document.getElementById('prevWeek').disabled = currentWeek === 0;
  document.getElementById('nextWeek').disabled = currentWeek === WEEKS - 1;

  // Balance
  const carry = getCarryOver(currentWeek);
  const earned = getWeekScoreTotal(currentWeek);
  const deducted = getWeekDeductTotal(currentWeek);
  const redeemed = getWeekRedeemTotal(currentWeek);
  const balance = carry + earned - deducted - redeemed;
  document.getElementById('totalBalance').textContent = balance;
  document.getElementById('balanceDetail').textContent = `上周结余 ${carry} + 本周得分 ${earned} - 扣分 ${deducted} - 已兑换 ${redeemed}`;

  let html = '';
  
  // Score Card
  html += '<div class="card"><div class="card-title" style="color:var(--green)">🏆 得分表</div>';
  SCORE_ITEMS.forEach(item => {
    const pts = getItemWeekPoints(item, currentWeek);
    html += `<div class="score-item"><div class="icon">${item.icon}</div><div class="info"><div class="name">${item.name}</div><div class="rule">${item.rule}</div>`;
    
    if (item.type === 'streak') {
      html += '<div class="days-row">';
      for (let d = 0; d < 7; d++) {
        const checked = data.weeks[currentWeek].scores[item.id][d];
        const streak = checked ? getStreakPoints(item.id, currentWeek, d) : 0;
        html += `<div class="day-btn ${checked?'checked':''}" onclick="toggleDay('${item.id}',${d})">
          <span class="day-label">${DAYS[d]} ${getDayDate(currentWeek,d)}</span>
          <span class="day-pts">${checked ? '+'+streak : ''}</span></div>`;
      }
      html += '</div>';
      let currentStreak = 0;
      for (let d = 6; d >= 0; d--) {
        if (data.weeks[currentWeek].scores[item.id][d]) {
          currentStreak = getStreakPoints(item.id, currentWeek, d);
          break;
        }
      }
      if (currentStreak > 0) html += `<div class="streak-info">🔥 当前连续 ${currentStreak} 天</div>`;
    } else {
      const count = data.weeks[currentWeek].scores[item.id];
      html += `<div class="counter-row">
        <button class="counter-btn" onclick="changeCounter('${item.id}',-1)">−</button>
        <span class="counter-val">${count}</span>
        <button class="counter-btn" onclick="changeCounter('${item.id}',1)">+</button>
        <span style="font-size:11px;color:#999">× ${item.pts}分</span></div>`;
    }
    
    html += `</div><div class="points-earned">+${pts}</div></div>`;
  });
  html += '</div>';

  // Deduction Card
  html += '<div class="card"><div class="card-title" style="color:var(--orange)">⚠️ 扣分项</div>';
  html += '<div class="score-item"><div class="icon">🚫</div><div class="info"><div class="name">8:05后出门</div><div class="rule">每晚1分钟扣1分（超过8:05的分钟数）</div>';
  html += '<div class="days-row">';
  for (let d = 0; d < 7; d++) {
    const val = data.weeks[currentWeek].deductions[d];
    html += `<div style="text-align:center"><span style="font-size:9px;color:#999">${DAYS[d]}<br>${getDayDate(currentWeek,d)}</span><br>
      <input type="number" min="0" value="${val || ''}" placeholder="0" class="deduct-input-field"
        onchange="updateDeduction(${d},this.value)" 
        style="width:36px;height:30px;border:1.5px solid ${val?'var(--red)':'#ddd'};border-radius:8px;text-align:center;font-size:12px;font-weight:600;color:var(--red);background:${val?'var(--light-orange)':'white'}"></div>`;
  }
  html += '</div></div>';
  const deductTotal = getWeekDeductTotal(currentWeek);
  html += `<div class="points-earned" style="color:var(--red)">${deductTotal > 0 ? '-' + deductTotal : '0'}</div></div></div>`;

  // Reward Card
  html += '<div class="card"><div class="card-title" style="color:var(--purple)">🎁 积分兑换</div>';
  REWARDS.forEach(r => {
    const count = data.weeks[currentWeek].redeemed[r.id] || 0;
    const canAfford = balance >= r.cost;
    const maxedOut = r.weeklyMax && count >= r.weeklyMax;
    let btnClass = 'unavailable', btnText = `${r.cost}分`;
    if (count > 0) { btnClass = 'redeemed'; btnText = `已换${count}次`; }
    else if (maxedOut) { btnClass = 'unavailable'; btnText = '已达上限'; }
    else if (canAfford) { btnClass = 'available'; btnText = `${r.cost}分 兑换`; }
    
    html += `<div class="reward-item">
      <div class="r-icon">${r.icon}</div>
      <div class="r-info">
        <div class="r-name">${r.name}</div>
        <div class="r-cost">${r.cost}积分${r.limit ? ' · ' + r.limit : ''}</div>
      </div>`;
    html += `<button class="redeem-btn ${btnClass}" onclick="redeemReward('${r.id}')">${btnText}</button></div>`;
  });
  html += '</div>';

  // Redeemed History Card - 已兑换记录
  let hasRedeemed = false;
  let redeemedHtml = '';
  for (let w = 0; w < WEEKS; w++) {
    const weekRedeemed = data.weeks[w].redeemed;
    REWARDS.forEach(r => {
      const cnt = weekRedeemed[r.id] || 0;
      if (cnt > 0) {
        hasRedeemed = true;
        const ws = new Date(START_DATE.getTime() + w * 7 * 86400000);
        const we = new Date(ws.getTime() + 6 * 86400000);
        const weekStr = `第${w+1}周 (${ws.getMonth()+1}/${ws.getDate()}-${we.getMonth()+1}/${we.getDate()})`;
        for (let i = 0; i < cnt; i++) {
          redeemedHtml += `<div class="reward-item" style="padding:8px 0">
            <div class="r-icon">${r.icon}</div>
            <div class="r-info">
              <div class="r-name">${r.name}</div>
              <div class="r-cost" style="font-size:11px;color:#999">${weekStr} · ${r.cost}积分</div>
            </div>
            <button class="redeem-btn" onclick="cancelRedeem(${w},'${r.id}')" 
              style="background:var(--light-orange);color:var(--orange);font-size:11px;padding:6px 10px;border:1px solid var(--orange)">
              退回积分</button>
          </div>`;
        }
      }
    });
  }
  if (hasRedeemed) {
    html += `<div class="card"><div class="card-title" style="color:var(--orange)">📋 已兑换记录 <span style="font-size:12px;font-weight:400;color:#999">（可取消退回积分）</span></div>${redeemedHtml}</div>`;
  }

  // Summary
  html += `<div class="card">
    <div class="card-title" style="color:var(--blue)">📊 本周统计</div>
    <div class="summary-row"><span class="s-label">🏅 得分合计</span><span class="s-value positive">+${earned}</span></div>
    <div class="summary-row"><span class="s-label">⚠️ 扣分合计</span><span class="s-value negative">${deducted > 0 ? '-'+deducted : '0'}</span></div>
    <div class="summary-row"><span class="s-label">🎁 已兑换</span><span class="s-value negative">${redeemed > 0 ? '-'+redeemed : '0'}</span></div>
    <div class="summary-row" style="border-top:2px solid var(--blue);padding-top:12px"><span class="s-label">💰 本周结余</span><span class="s-value neutral" style="font-size:24px">${balance}</span></div>
  </div>`;

  document.getElementById('content').innerHTML = html;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function fireConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#FFD700','#FF6B6B','#4ECDC4','#7030A0','#70AD47','#ED7D31'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

function confirmReset() {
  if (!checkUnlocked()) return;
  if (confirm('确定要重置所有数据吗？这将清除所有打卡记录和兑换记录。')) {
    if (confirm('再次确认：真的要全部清零吗？')) {
      data = initData();
      saveData();
      currentWeek = 0;
      render();
      showToast('🔄 数据已重置');
    }
  }
}

render();
</script>
</body>
</html>
