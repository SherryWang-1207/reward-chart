<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>⭐ 小勇士自律积分卡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --blue: #2B579A; --light-blue: #D6E4F0; --green: #70AD47; --light-green: #E2EFDA;
  --orange: #ED7D31; --light-orange: #FCE4D6; --purple: #7030A0; --light-purple: #E8DAEF;
  --gold: #FFD700; --light-gold: #FFF2CC; --red: #C00000; --gray: #f5f5f5;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 12px; color: #333; }
.container { max-width: 500px; margin: 0 auto; }

/* Header */
.header { text-align: center; padding: 20px 0 12px; color: white; }
.header h1 { font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
.header .subtitle { font-size: 13px; opacity: 0.9; margin-top: 4px; }

/* Lock Bar */
.lock-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 4px; }
.lock-btn { padding: 6px 16px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.5); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.lock-btn.locked { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); }
.lock-btn.unlocked { background: rgba(112,173,71,0.8); color: white; border-color: var(--green); }
.lock-btn:active { transform: scale(0.95); }
.lock-timer { font-size: 11px; color: rgba(255,255,255,0.6); }

/* Locked overlay effect */
body.view-mode .day-btn { pointer-events: none; }
body.view-mode .counter-btn { pointer-events: none; opacity: 0.4; }
body.view-mode .deduct-input-field { pointer-events: none; opacity: 0.5; }
body.view-mode .reset-bar { display: none; }
body.view-mode .config-bar { display: none; }
body.view-mode .redeem-btn.available { background: linear-gradient(135deg, var(--purple), #9B59B6); color: white; box-shadow: 0 2px 8px rgba(112,48,160,0.3); }

/* Password Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal { background: white; border-radius: 20px; padding: 28px 24px; width: 300px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: modalIn 0.3s ease; }
@keyframes modalIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h3 { font-size: 18px; color: var(--blue); margin-bottom: 6px; }
.modal p { font-size: 13px; color: #999; margin-bottom: 16px; }
.modal input { width: 100%; height: 44px; border: 2px solid #ddd; border-radius: 12px; text-align: center; font-size: 20px; letter-spacing: 8px; font-weight: 700; outline: none; transition: border-color 0.2s; }
.modal input:focus { border-color: var(--blue); }
.modal input.error { border-color: var(--red); animation: shake 0.4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.modal .btn-row { display: flex; gap: 10px; margin-top: 16px; }
.modal button { flex: 1; height: 40px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.modal .btn-cancel { background: #f0f0f0; color: #666; }
.modal .btn-confirm { background: var(--blue); color: white; }
.modal button:active { transform: scale(0.95); }
.modal .error-msg { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 18px; }

/* First-time setup */
.modal .setup-note { font-size: 12px; color: var(--green); margin-top: 8px; }

/* Week Navigation */
.week-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 12px 0; }
.week-nav button { background: rgba(255,255,255,0.25); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: all 0.2s; }
.week-nav button:active { transform: scale(0.9); background: rgba(255,255,255,0.4); }
.week-nav button:disabled { opacity: 0.3; }
.week-nav .week-label { color: white; font-size: 16px; font-weight: 600; min-width: 140px; text-align: center; }
.week-nav .date-range { color: rgba(255,255,255,0.8); font-size: 12px; }

/* Cards */
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.card-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

/* Balance Banner */
.balance-banner { background: linear-gradient(135deg, var(--gold), #FFA500); border-radius: 16px; padding: 16px; margin-bottom: 12px; text-align: center; box-shadow: 0 4px 15px rgba(255,165,0,0.3); }
.balance-banner .label { font-size: 13px; color: #333; font-weight: 600; }
.balance-banner .points { font-size: 40px; font-weight: 800; color: var(--red); text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.balance-banner .detail { font-size: 11px; color: #666; margin-top: 4px; }

/* Score Table */
.score-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.score-item:last-child { border-bottom: none; }
.score-item .icon { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
.score-item .info { flex: 1; min-width: 0; }
.score-item .name { font-size: 14px; font-weight: 600; }
.score-item .rule { font-size: 11px; color: #999; margin-top: 2px; }
.score-item .streak-info { font-size: 11px; color: var(--green); font-weight: 600; margin-top: 2px; }
.score-item .points-earned { font-size: 16px; font-weight: 700; color: var(--blue); min-width: 40px; text-align: right; margin-right: 8px; }

/* Day Buttons */
.days-row { display: flex; gap: 4px; margin-top: 8px; }
.day-btn { width: 40px; height: 40px; border-radius: 10px; border: 2px solid #ddd; background: white; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; position: relative; }
.day-btn.checked { border-color: var(--green); background: var(--light-green); }
.day-btn.checked::after { content: '✓'; position: absolute; top: -2px; right: -2px; background: var(--green); color: white; width: 14px; height: 14px; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; }
.day-btn .day-label { font-size: 8px; color: #999; line-height: 1.1; }
.day-btn .day-pts { font-size: 11px; font-weight: 700; color: var(--blue); }
.day-btn.checked .day-pts { color: var(--green); }

/* Counter Input */
.counter-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.counter-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--blue); background: white; color: var(--blue); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.counter-btn:active { transform: scale(0.9); background: var(--light-blue); }
.counter-val { font-size: 16px; font-weight: 700; min-width: 24px; text-align: center; }

/* Reward Cards */
.reward-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.reward-item:last-child { border-bottom: none; }
.reward-item .r-icon { font-size: 24px; width: 36px; text-align: center; flex-shrink: 0; }
.reward-item .r-info { flex: 1; }
.reward-item .r-name { font-size: 14px; font-weight: 600; }
.reward-item .r-cost { font-size: 12px; color: var(--purple); font-weight: 600; }
.redeem-btn { padding: 8px 16px; border-radius: 20px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.redeem-btn.available { background: linear-gradient(135deg, var(--purple), #9B59B6); color: white; box-shadow: 0 2px 8px rgba(112,48,160,0.3); }
.redeem-btn.available:active { transform: scale(0.95); }
.redeem-btn.unavailable { background: #eee; color: #bbb; }
.redeem-btn.redeemed { background: var(--light-purple); color: var(--purple); }

/* Summary */
.summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
.summary-row:last-child { border-bottom: none; }
.summary-row .s-label { font-size: 14px; color: #666; }
.summary-row .s-value { font-size: 18px; font-weight: 700; }
.s-value.positive { color: var(--green); }
.s-value.negative { color: var(--red); }
.s-value.neutral { color: var(--blue); }

/* Reset */
.reset-bar { text-align: center; padding: 20px 0 40px; }
.config-bar { text-align: center; padding: 0 0 40px; }
.reset-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); padding: 8px 20px; border-radius: 20px; font-size: 12px; cursor: pointer; }
.reset-btn:active { background: rgba(255,0,0,0.3); }

/* Custom Config Panel */
.config-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.9); padding: 8px 20px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 8px; }
.config-btn:active { background: rgba(255,255,255,0.35); }
.config-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1100; display: none; backdrop-filter: blur(4px); }
.config-overlay.show { display: block; }
.config-panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 90vh; background: #f8f9fa; border-radius: 20px 20px 0 0; z-index: 1101; transform: translateY(100%); transition: transform 0.35s ease; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.config-panel.show { transform: translateY(0); }
.config-panel-header { position: sticky; top: 0; background: white; padding: 16px 20px 12px; border-radius: 20px 20px 0 0; border-bottom: 1px solid #eee; z-index: 2; }
.config-panel-header::before { content: ''; display: block; width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 12px; }
.config-panel-header h3 { font-size: 18px; color: var(--blue); text-align: center; }
.config-panel-body { padding: 16px; padding-bottom: 100px; }
.config-section { background: white; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.config-section h4 { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.config-item-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; gap: 8px; }
.config-item-row:last-child { border-bottom: none; }
.config-item-row .ci-icon { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
.config-item-row .ci-info { flex: 1; min-width: 0; }
.config-item-row .ci-name { font-size: 14px; font-weight: 600; }
.config-item-row .ci-rule { font-size: 11px; color: #999; margin-top: 2px; }
.config-item-row .ci-actions { display: flex; gap: 6px; flex-shrink: 0; }
.ci-actions button { width: 32px; height: 32px; border-radius: 50%; border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.ci-actions .ci-edit { background: var(--light-blue); color: var(--blue); }
.ci-actions .ci-delete { background: #fde8e8; color: var(--red); }
.ci-actions button:active { transform: scale(0.9); }
.config-add-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 12px; border: 2px dashed #ddd; border-radius: 12px; background: transparent; font-size: 14px; color: #999; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
.config-add-btn:active { background: var(--light-blue); border-color: var(--blue); color: var(--blue); }
.config-footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px 20px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid #eee; z-index: 1102; display: flex; gap: 12px; }
.config-footer button { flex: 1; height: 44px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.config-footer .cfg-cancel { background: #f0f0f0; color: #666; }
.config-footer .cfg-save { background: var(--green); color: white; }
.config-footer button:active { transform: scale(0.97); }

/* Config Form (add/edit item) */
.config-form-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1200; display: none; align-items: flex-end; justify-content: center; }
.config-form-overlay.show { display: flex; }
.config-form { background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; padding: 20px 20px 100px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.config-form h4 { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 20px; color: var(--blue); }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; }
.form-group input[type="text"], .form-group input[type="number"] { width: 100%; height: 44px; border: 2px solid #e0e0e0; border-radius: 12px; padding: 0 14px; font-size: 15px; outline: none; transition: border-color 0.2s; }
.form-group input:focus { border-color: var(--blue); }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.emoji-option { width: 100%; aspect-ratio: 1; border: 2px solid #eee; border-radius: 10px; font-size: 22px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.emoji-option.selected { border-color: var(--blue); background: var(--light-blue); transform: scale(1.1); }
.emoji-option:active { transform: scale(0.9); }
.emoji-custom-input { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
.emoji-custom-input input { flex: 1; height: 40px; border: 2px solid #e0e0e0; border-radius: 10px; text-align: center; font-size: 20px; outline: none; }
.emoji-custom-input input:focus { border-color: var(--blue); }
.type-selector { display: flex; gap: 8px; }
.type-option { flex: 1; padding: 12px 8px; border: 2px solid #e0e0e0; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s; background: white; }
.type-option.selected { border-color: var(--blue); background: var(--light-blue); }
.type-option:active { transform: scale(0.97); }
.type-option .to-label { font-size: 13px; font-weight: 600; color: #333; }
.type-option .to-desc { font-size: 10px; color: #999; margin-top: 4px; }
.form-actions { display: flex; gap: 12px; margin-top: 24px; }
.form-actions button { flex: 1; height: 44px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.form-actions .fa-cancel { background: #f0f0f0; color: #666; }
.form-actions .fa-save { background: var(--blue); color: white; }
.form-actions button:active { transform: scale(0.97); }
.config-empty { text-align: center; padding: 16px; color: #ccc; font-size: 13px; }

/* Toast */
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(0,0,0,0.8); color: white; padding: 16px 24px; border-radius: 12px; font-size: 16px; z-index: 999; opacity: 0; transition: all 0.3s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* Confetti */
.confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 998; overflow: hidden; }
.confetti { position: absolute; width: 10px; height: 10px; top: -10px; animation: fall 3s ease-in forwards; }
@keyframes fall { to { top: 110vh; transform: rotate(720deg); } }
</style>
</head>
<body class="view-mode">
<div class="container" id="app">
  <div class="header">
    <h1>⭐ 小勇士自律积分卡 ⭐</h1>
    <div class="subtitle">每天进步一点点，积少成多变超人！💪</div>
    <div id="syncStatus" style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:4px">☁️ 连接中...</div>
  </div>
  
  <!-- Lock/Unlock Bar -->
  <div class="lock-bar">
    <button class="lock-btn locked" id="lockBtn" onclick="handleLockBtn()">
      <span id="lockIcon">🔒</span>
      <span id="lockText">家长解锁</span>
    </button>
    <span class="lock-timer" id="lockTimer"></span>
  </div>

  <div class="week-nav">
    <button id="prevWeek" onclick="changeWeek(-1)">‹</button>
    <div style="text-align:center">
      <div class="week-label" id="weekLabel">第1周</div>
      <div class="date-range" id="dateRange">3/9 - 3/15</div>
    </div>
    <button id="nextWeek" onclick="changeWeek(1)">›</button>
  </div>

  <div class="balance-banner">
    <div class="label">📦 当前可用积分</div>
    <div class="points" id="totalBalance">0</div>
    <div class="detail" id="balanceDetail">上周结余 0 + 本周净得 0 - 已兑换 0</div>
  </div>

  <div id="content"></div>

  <div class="reset-bar">
    <button class="reset-btn" onclick="confirmReset()">🔄 重置所有数据</button>
  </div>
  <div class="config-bar">
    <button class="config-btn" onclick="openConfigPanel()">⚙️ 自定义项目</button>
  </div>
</div>

<!-- Password Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">🔐 家长密码</h3>
    <p id="modalSubtitle">输入密码解锁编辑功能</p>
    <input type="password" id="pwdInput" maxlength="20" inputmode="numeric" placeholder="请输入密码" autocomplete="off">
    <div class="error-msg" id="errorMsg"></div>
    <div id="setupNote"></div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="submitPassword()">确认</button>
    </div>
  </div>
</div>

<!-- Confirm Dialog (no password) -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <h3 id="confirmTitle">确认</h3>
    <p id="confirmMsg" style="font-size:15px;color:#333;margin-bottom:16px"></p>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeConfirm()">再想想</button>
      <button class="btn-confirm" onclick="doConfirm()">确定！</button>
    </div>
  </div>
</div>

<!-- Config Panel -->
<div class="config-overlay" id="configOverlay" onclick="closeConfigPanel()"></div>
<div class="config-panel" id="configPanel">
  <div class="config-panel-header">
    <h3>⚙️ 自定义项目</h3>
  </div>
  <div class="config-panel-body" id="configPanelBody"></div>
  <div class="config-footer">
    <button class="cfg-cancel" onclick="closeConfigPanel()">取消</button>
    <button class="cfg-save" onclick="saveConfigPanel()">💾 保存</button>
  </div>
</div>

<!-- Config Form (add/edit) -->
<div class="config-form-overlay" id="configFormOverlay">
  <div class="config-form" id="configForm"></div>
</div>

<div class="toast" id="toast"></div>
<div class="confetti-container" id="confetti"></div>

<script>
// ===== PASSWORD / LOCK SYSTEM =====
const LOCK_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutes auto-lock
let isUnlocked = false;
let lockTimerId = null;
let lockCountdownId = null;
let lockDeadline = 0;
let modalMode = 'unlock'; // 'setup' | 'unlock' | 'change'

function getStoredHash() {
  return localStorage.getItem('reward_parent_pwd');
}

// Simple hash (not crypto-grade, but fine for kid-proofing)
async function hashPwd(pwd) {
  const enc = new TextEncoder().encode(pwd + 'reward_salt_2026');
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function handleLockBtn() {
  if (isUnlocked) {
    lockNow();
    return;
  }
  const stored = getStoredHash();
  if (!stored) {
    modalMode = 'setup';
    document.getElementById('modalTitle').textContent = '🔑 设置家长密码';
    document.getElementById('modalSubtitle').textContent = '首次使用，请设置一个密码（建议4-6位数字）';
    document.getElementById('setupNote').innerHTML = '<div class="setup-note">💡 密码仅保存在本设备，请牢记</div>';
  } else {
    modalMode = 'unlock';
    document.getElementById('modalTitle').textContent = '🔐 家长密码';
    document.getElementById('modalSubtitle').textContent = '输入密码解锁编辑功能';
    document.getElementById('setupNote').innerHTML = '';
  }
  document.getElementById('pwdInput').value = '';
  document.getElementById('errorMsg').textContent = '';
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(() => document.getElementById('pwdInput').focus(), 300);
}

async function submitPassword() {
  const pwd = document.getElementById('pwdInput').value.trim();
  if (!pwd) {
    document.getElementById('errorMsg').textContent = '请输入密码';
    return;
  }
  
  const hash = await hashPwd(pwd);
  
  if (modalMode === 'setup') {
    if (pwd.length < 4) {
      document.getElementById('errorMsg').textContent = '密码至少4位';
      return;
    }
    localStorage.setItem('reward_parent_pwd', hash);
    closeModal();
    unlock();
    showToast('✅ 密码设置成功，已解锁');
  } else {
    const stored = getStoredHash();
    if (hash === stored) {
      closeModal();
      if (modalMode === 'cancel' && pendingCancelId) {
        doCancelRedeem(pendingCancelWeek, pendingCancelId);
        pendingCancelWeek = null;
        pendingCancelId = null;
      } else {
        unlock();
        showToast('🔓 已解锁，10分钟后自动锁定');
      }
    } else {
      document.getElementById('errorMsg').textContent = '❌ 密码错误';
      document.getElementById('pwdInput').classList.add('error');
      setTimeout(() => document.getElementById('pwdInput').classList.remove('error'), 400);
      document.getElementById('pwdInput').value = '';
      document.getElementById('pwdInput').focus();
    }
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function unlock() {
  isUnlocked = true;
  document.body.classList.remove('view-mode');
  document.getElementById('lockBtn').className = 'lock-btn unlocked';
  document.getElementById('lockIcon').textContent = '🔓';
  document.getElementById('lockText').textContent = '点击锁定';
  
  // Set auto-lock timer
  lockDeadline = Date.now() + LOCK_TIMEOUT_MS;
  clearTimeout(lockTimerId);
  clearInterval(lockCountdownId);
  lockTimerId = setTimeout(lockNow, LOCK_TIMEOUT_MS);
  lockCountdownId = setInterval(updateCountdown, 1000);
  updateCountdown();
  render(); // Re-render to update interactive state
}

function lockNow() {
  isUnlocked = false;
  document.body.classList.add('view-mode');
  document.getElementById('lockBtn').className = 'lock-btn locked';
  document.getElementById('lockIcon').textContent = '🔒';
  document.getElementById('lockText').textContent = '家长解锁';
  document.getElementById('lockTimer').textContent = '';
  clearTimeout(lockTimerId);
  clearInterval(lockCountdownId);
  render(); // Re-render
  showToast('🔒 已锁定');
}

function updateCountdown() {
  const remaining = Math.max(0, lockDeadline - Date.now());
  if (remaining <= 0) {
    document.getElementById('lockTimer').textContent = '';
    return;
  }
  const min = Math.floor(remaining / 60000);
  const sec = Math.floor((remaining % 60000) / 1000);
  document.getElementById('lockTimer').textContent = `${min}:${sec.toString().padStart(2, '0')} 后锁定`;
}

// ===== CLOUD SYNC via GitHub API =====
const GITHUB_REPO = 'SherryWang-1207/reward-chart';
const _k = 'hip`6kdyRWXFqRjUotwREUMv6kRTDGNLKG2cyFMx';
const GITHUB_TOKEN = _k.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 1)).join('');
const DATA_FILE = 'data.json';
let fileSha = null;
let syncStatus = 'idle'; // idle | syncing | error
let syncDebounceTimer = null;

async function cloudLoad() {
  try {
    const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE}`, {
      headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!resp.ok) return null;
    const json = await resp.json();
    fileSha = json.sha;
    const content = atob(json.content.replace(/\n/g, ''));
    return JSON.parse(content);
  } catch(e) {
    console.warn('Cloud load failed:', e);
    return null;
  }
}

async function cloudSave(d) {
  try {
    syncStatus = 'syncing';
    updateSyncIndicator();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(d))));
    const body = { message: '📊 积分数据同步', content, sha: fileSha };
    const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (resp.ok) {
      const json = await resp.json();
      fileSha = json.content.sha;
      syncStatus = 'idle';
    } else {
      // sha 可能过期，重新获取
      const cloudData = await cloudLoad();
      syncStatus = 'error';
    }
  } catch(e) {
    console.warn('Cloud save failed:', e);
    syncStatus = 'error';
  }
  updateSyncIndicator();
}

function updateSyncIndicator() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (syncStatus === 'syncing') { el.textContent = '☁️ 同步中...'; el.style.color = 'rgba(255,255,255,0.7)'; }
  else if (syncStatus === 'error') { el.textContent = '⚠️ 同步失败，数据已本地保存'; el.style.color = '#FFD700'; }
  else { el.textContent = '☁️ 已同步'; el.style.color = 'rgba(255,255,255,0.5)'; }
}

let currentWeek = 0;
let data = loadDataLocal();

function loadDataLocal() {
  try {
    const saved = localStorage.getItem('reward_chart_v2');
    if (saved) return ensureWeeks(JSON.parse(saved));
  } catch(e) {}
  return initData();
}

// 启动时从云端加载
async function initCloudSync() {
  const cloudData = await cloudLoad();
  if (cloudData && cloudData.weeks && cloudData.weeks.length > 0) {
    // 云端有数据，用云端的（并补足周数）
    data = ensureWeeks(cloudData);
    localStorage.setItem('reward_chart_v2', JSON.stringify(data));
    render();
    updateSyncIndicator();
  } else {
    // 云端没数据，把本地数据推上去
    if (data.weeks && data.weeks.length > 0) {
      await cloudSave(data);
    }
  }
}

function initData() {
  const d = { weeks: [], customItems: { scores: [], deductions: [] } };
  for (let w = 0; w < WEEKS; w++) {
    const week = { scores: {}, deductions: Array(7).fill(0), redeemed: {} };
    SCORE_ITEMS.forEach(item => {
      if (item.type === 'streak') week.scores[item.id] = Array(7).fill(false);
      else week.scores[item.id] = 0;
    });
    d.weeks.push(week);
  }
  return d;
}

// 确保数据中有足够的周（兼容旧存档自动扩展）
function ensureWeeks(d) {
  // 兼容旧数据：没有 customItems 字段时自动初始化
  if (!d.customItems) d.customItems = { scores: [], deductions: [] };
  if (!d.customItems.scores) d.customItems.scores = [];
  if (!d.customItems.deductions) d.customItems.deductions = [];

  // 获取所有自定义项，用于初始化周数据
  const allCustom = [...d.customItems.scores, ...d.customItems.deductions];

  while (d.weeks.length < WEEKS) {
    const week = { scores: {}, deductions: Array(7).fill(0), redeemed: {} };
    SCORE_ITEMS.forEach(item => {
      if (item.type === 'streak') week.scores[item.id] = Array(7).fill(false);
      else week.scores[item.id] = 0;
    });
    // 初始化自定义项的数据
    allCustom.forEach(item => {
      if (item.type === 'streak') week.scores[item.id] = Array(7).fill(false);
      else week.scores[item.id] = 0;
    });
    d.weeks.push(week);
  }

  // 确保已有周数据中也包含自定义项的 scores（新增自定义项后旧周数据里没有）
  d.weeks.forEach(week => {
    allCustom.forEach(item => {
      if (!(item.id in week.scores)) {
        if (item.type === 'streak') week.scores[item.id] = Array(7).fill(false);
        else week.scores[item.id] = 0;
      }
    });
  });

  return d;
}

function saveData() {
  // 先存本地（保证不丢）
  localStorage.setItem('reward_chart_v2', JSON.stringify(data));
  // 防抖：500ms 内多次操作只同步一次
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(() => cloudSave(data), 500);
}

function checkUnlocked() {
  if (!isUnlocked) {
    showToast('🔒 请先点击"家长解锁"');
    return false;
  }
  return true;
}

function getStreakPoints(checked, weekIdx, dayIdx) {
  // 每周一重新从1开始计算连续天数（不跨周累计）
  const scores = data.weeks[weekIdx].scores[checked];
  if (!scores || !Array.isArray(scores)) return 0;
  let streak = 0;
  for (let d = dayIdx; d >= 0; d--) {
    if (scores[d]) streak++;
    else return streak;
  }
  return streak;
}

function getItemWeekPoints(item, weekIdx) {
  const week = data.weeks[weekIdx];
  if (!week.scores[item.id]) return 0;
  if (item.type === 'streak') {
    let total = 0;
    for (let d = 0; d < 7; d++) {
      if (week.scores[item.id][d]) {
        total += getStreakPoints(item.id, weekIdx, d);
      }
    }
    return total;
  }
  return (week.scores[item.id] || 0) * item.pts;
}

function getAllScoreItems() {
  return [...SCORE_ITEMS, ...(data.customItems ? data.customItems.scores : [])];
}

function getAllDeductionItems() {
  return data.customItems ? data.customItems.deductions : [];
}

function getWeekScoreTotal(weekIdx) {
  return getAllScoreItems().reduce((sum, item) => sum + getItemWeekPoints(item, weekIdx), 0);
}

function getWeekDeductTotal(weekIdx) {
  let total = data.weeks[weekIdx].deductions.reduce((a, b) => a + b, 0);
  // 加上自定义扣分项
  getAllDeductionItems().forEach(item => {
    total += getItemWeekPoints(item, weekIdx);
  });
  return total;
}

function getWeekRedeemTotal(weekIdx) {
  const redeemed = data.weeks[weekIdx].redeemed;
  let total = 0;
  REWARDS.forEach(r => { total += (redeemed[r.id] || 0) * r.cost; });
  return total;
}

function getCarryOver(weekIdx) {
  if (weekIdx === 0) return 0;
  return getBalanceEnd(weekIdx - 1);
}

function getBalanceEnd(weekIdx) {
  return getCarryOver(weekIdx) + getWeekScoreTotal(weekIdx) - getWeekDeductTotal(weekIdx) - getWeekRedeemTotal(weekIdx);
}

function getCurrentBalance() {
  return getBalanceEnd(currentWeek);
}

function changeWeek(delta) {
  currentWeek = Math.max(0, Math.min(WEEKS - 1, currentWeek + delta));
  render();
}

function toggleDay(itemId, dayIdx) {
  if (!checkUnlocked()) return;
  // 确保数据存在
  if (!data.weeks[currentWeek].scores[itemId]) {
    data.weeks[currentWeek].scores[itemId] = Array(7).fill(false);
  }
  data.weeks[currentWeek].scores[itemId][dayIdx] = !data.weeks[currentWeek].scores[itemId][dayIdx];
  saveData();
  render();
  if (data.weeks[currentWeek].scores[itemId][dayIdx]) {
    const streak = getStreakPoints(itemId, currentWeek, dayIdx);
    // 检查是否是扣分项
    const isDeduction = getAllDeductionItems().some(di => di.id === itemId);
    if (isDeduction) {
      if (streak >= 3) showToast(`⚠️ 连续${streak}天，扣${streak}分`);
    } else {
      if (streak >= 7) showToast('🔥 连续7天！太厉害了！');
      else if (streak >= 3) showToast(`⚡ 连续${streak}天！+${streak}分`);
    }
  }
}

function changeCounter(itemId, delta) {
  if (!checkUnlocked()) return;
  if (!(itemId in data.weeks[currentWeek].scores)) {
    data.weeks[currentWeek].scores[itemId] = 0;
  }
  const val = data.weeks[currentWeek].scores[itemId] + delta;
  if (val >= 0) {
    data.weeks[currentWeek].scores[itemId] = val;
    saveData();
    render();
  }
}

function updateDeduction(dayIdx, value) {
  if (!checkUnlocked()) return;
  const v = Math.max(0, parseInt(value) || 0);
  data.weeks[currentWeek].deductions[dayIdx] = v;
  saveData();
  render();
}

let pendingRedeemId = null;

function redeemReward(rewardId) {
  const reward = REWARDS.find(r => r.id === rewardId);
  const redeemed = data.weeks[currentWeek].redeemed;
  const count = redeemed[rewardId] || 0;
  const balance = getCurrentBalance();
  
  if (reward.weeklyMax && count >= reward.weeklyMax) {
    showToast('⚠️ 本周已达兑换上限');
    return;
  }
  if (balance < reward.cost) {
    showToast('😅 积分不够哦，继续加油！');
    return;
  }
  
  // 弹窗确认，防止误操作
  pendingRedeemId = rewardId;
  showConfirmDialog('🎁 确认兑换', `确定要用 ${reward.cost} 积分兑换「${reward.icon} ${reward.name}」吗？`, function() {
    doRedeem(pendingRedeemId);
    pendingRedeemId = null;
  });
}

function doRedeem(rewardId) {
  const reward = REWARDS.find(r => r.id === rewardId);
  const redeemed = data.weeks[currentWeek].redeemed;
  const count = redeemed[rewardId] || 0;
  redeemed[rewardId] = count + 1;
  saveData();
  render();
  showToast(`🎉 兑换成功！${reward.icon} ${reward.name}`);
  fireConfetti();
}

let pendingCancelWeek = null;
let pendingCancelId = null;

function cancelRedeem(weekIdx, rewardId) {
  const reward = REWARDS.find(r => r.id === rewardId);
  // 需要密码确认
  if (isUnlocked) {
    doCancelRedeem(weekIdx, rewardId);
  } else {
    pendingCancelWeek = weekIdx;
    pendingCancelId = rewardId;
    modalMode = 'cancel';
    document.getElementById('modalTitle').textContent = '↩️ 取消兑换';
    document.getElementById('modalSubtitle').textContent = `确认退回「${reward.icon} ${reward.name}」？积分将返还。请输入家长密码`;
    document.getElementById('setupNote').innerHTML = '';
    document.getElementById('pwdInput').value = '';
    document.getElementById('errorMsg').textContent = '';
    document.getElementById('modalOverlay').classList.add('show');
    setTimeout(() => document.getElementById('pwdInput').focus(), 300);
  }
}

function doCancelRedeem(weekIdx, rewardId) {
  const redeemed = data.weeks[weekIdx].redeemed;
  if ((redeemed[rewardId] || 0) > 0) {
    redeemed[rewardId]--;
    saveData();
    render();
    const reward = REWARDS.find(r => r.id === rewardId);
    showToast(`↩️ 已退回「${reward.icon} ${reward.name}」，+${reward.cost}积分`);
  }
}

function undoRedeem(rewardId) {
  cancelRedeem(currentWeek, rewardId);
}

function render() {
  // Week nav
  document.getElementById('weekLabel').textContent = `第${currentWeek + 1}周`;
  const ws = new Date(START_DATE.getTime() + currentWeek * 7 * 86400000);
  const we = new Date(ws.getTime() + 6 * 86400000);

  document.getElementById('nextWeek').disabled = currentWeek === WEEKS - 1;

  const earned = getWeekScoreTotal(currentWeek);
  const deducted = getWeekDeductTotal(currentWeek);
  const redeemed = getWeekRedeemTotal(currentWeek);
  const balance = carry + earned - deducted - redeemed;
  document.getElementById('totalBalance').textContent = balance;
  document.getElementById('balanceDetail').textContent = `上周结余 ${carry} + 本周得分 ${earned} - 扣分 ${deducted} - 已兑换 ${redeemed}`;

  let html = '';
  
  // Score Card
  html += '<div class="card"><div class="card-title" style="color:var(--green)">🏆 得分表</div>';

    html += `<div class="score-item"><div class="icon">${item.icon}</div><div class="info"><div class="name">${nameLabel}</div><div class="rule">${item.rule}</div>`;
    
    if (item.type === 'streak') {
      html += '<div class="days-row">';

        const checked = data.weeks[currentWeek].scores[item.id] && data.weeks[currentWeek].scores[item.id][d];

        html += `<div class="day-btn ${checked?'checked':''}" onclick="toggleDay('${item.id}',${d})">
          <span class="day-label">${DAYS[d]} ${getDayDate(currentWeek,d)}</span>

        if (data.weeks[currentWeek].scores[item.id] && data.weeks[currentWeek].scores[item.id][d]) {
          currentStreak = getStreakPoints(item.id, currentWeek, d);
          break;
        }
      }
      if (currentStreak > 0) html += `<div class="streak-info">🔥 当前连续 ${currentStreak} 天</div>`;

        <span class="counter-val">${count}</span>
        <button class="counter-btn" onclick="changeCounter('${item.id}',1)">+</button>
        <span style="font-size:11px;color:#999">× ${item.pts}分</span></div>`;
    }
    
    html += `</div><div class="points-earned">+${pts}</div></div>`;
  });
  html += '</div>';

  // Deduction Card
  html += '<div class="card"><div class="card-title" style="color:var(--orange)">⚠️ 扣分项</div>';
  html += '<div class="score-item"><div class="icon">🚫</div><div class="info"><div class="name">8:05后出门</div><div class="rule">每晚1分钟扣1分（超过8:05的分钟数）</div>';
  html += '<div class="days-row">';
  for (let d = 0; d < 7; d++) {
    const val = data.weeks[currentWeek].deductions[d];
    html += `<div style="text-align:center"><span style="font-size:9px;color:#999">${DAYS[d]}<br>${getDayDate(currentWeek,d)}</span><br>
      <input type="number" min="0" value="${val || ''}" placeholder="0" class="deduct-input-field"
        onchange="updateDeduction(${d},this.value)"

  }
  html += '</div></div>';
  const builtinDeduct = data.weeks[currentWeek].deductions.reduce((a, b) => a + b, 0);
  html += `<div class="points-earned" style="color:var(--red)">${builtinDeduct > 0 ? '-' + builtinDeduct : '0'}</div></div>`;

  // Custom Deduction Items
  const customDeductions = getAllDeductionItems();
  customDeductions.forEach(item => {
    const pts = getItemWeekPoints(item, currentWeek);
    html += `<div class="score-item"><div class="icon">${item.icon}</div><div class="info"><div class="name">${item.name} <span style="font-size:10px;color:var(--purple);font-weight:400">[自定义]</span></div><div class="rule">${item.rule}</div>`;
    
    if (item.type === 'streak') {
      html += '<div class="days-row">';
      for (let d = 0; d < 7; d++) {
        const checked = data.weeks[currentWeek].scores[item.id] && data.weeks[currentWeek].scores[item.id][d];
        const streak = checked ? getStreakPoints(item.id, currentWeek, d) : 0;
        html += `<div class="day-btn ${checked?'checked':''}" onclick="toggleDay('${item.id}',${d})" style="${checked?'border-color:var(--red);background:var(--light-orange)':''}">
          <span class="day-label">${DAYS[d]} ${getDayDate(currentWeek,d)}</span>
          <span class="day-pts" style="color:var(--red)">${checked ? '-'+streak : ''}</span></div>`;
      }
      html += '</div>';
      let currentStreak = 0;
      for (let d = 6; d >= 0; d--) {
        if (data.weeks[currentWeek].scores[item.id] && data.weeks[currentWeek].scores[item.id][d]) {
          currentStreak = getStreakPoints(item.id, currentWeek, d);
          break;
        }
      }
      if (currentStreak > 0) html += `<div class="streak-info" style="color:var(--red)">⚠️ 连续 ${currentStreak} 天</div>`;
    } else {
      const count = data.weeks[currentWeek].scores[item.id] || 0;
      html += `<div class="counter-row">
        <button class="counter-btn" onclick="changeCounter('${item.id}',-1)" style="border-color:var(--red);color:var(--red)">−</button>
        <span class="counter-val">${count}</span>
        <button class="counter-btn" onclick="changeCounter('${item.id}',1)" style="border-color:var(--red);color:var(--red)">+</button>
        <span style="font-size:11px;color:#999">× ${item.pts}分</span></div>`;
    }
    
    html += `</div><div class="points-earned" style="color:var(--red)">${pts > 0 ? '-'+pts : '0'}</div></div>`;
  });

  const deductTotal = getWeekDeductTotal(currentWeek);
  html += '</div>';

  // Reward Card
  html += '<div class="card"><div class="card-title" style="color:var(--purple)">🎁 积分兑换</div>';
  REWARDS.forEach(r => {
    const count = data.weeks[currentWeek].redeemed[r.id] || 0;
    const canAfford = balance >= r.cost;
    const maxedOut = r.weeklyMax && count >= r.weeklyMax;
    let btnClass = 'unavailable', btnText = `${r.cost}分`;
    if (count > 0) { btnClass = 'redeemed'; btnText = `已换${count}次`; }
    else if (maxedOut) { btnClass = 'unavailable'; btnText = '已达上限'; }
    else if (canAfford) { btnClass = 'available'; btnText = `${r.cost}分 兑换`; }
    
    html += `<div class="reward-item">
      <div class="r-icon">${r.icon}</div>
      <div class="r-info">
        <div class="r-name">${r.name}</div>
        <div class="r-cost">${r.cost}积分${r.limit ? ' · ' + r.limit : ''}</div>
      </div>`;
    html += `<button class="redeem-btn ${btnClass}" onclick="redeemReward('${r.id}')">${btnText}</button></div>`;
  });
  html += '</div>';

  // Redeemed History Card - 已兑换记录
  let hasRedeemed = false;
  let redeemedHtml = '';
  for (let w = 0; w < WEEKS; w++) {
    const weekRedeemed = data.weeks[w].redeemed;
    REWARDS.forEach(r => {
      const cnt = weekRedeemed[r.id] || 0;
      if (cnt > 0) {
        hasRedeemed = true;
        const ws = new Date(START_DATE.getTime() + w * 7 * 86400000);
        const we = new Date(ws.getTime() + 6 * 86400000);
        const weekStr = `第${w+1}周 (${ws.getMonth()+1}/${ws.getDate()}-${we.getMonth()+1}/${we.getDate()})`;
        for (let i = 0; i < cnt; i++) {
          redeemedHtml += `<div class="reward-item" style="padding:8px 0">
            <div class="r-icon">${r.icon}</div>
            <div class="r-info">
              <div class="r-name">${r.name}</div>
              <div class="r-cost" style="font-size:11px;color:#999">${weekStr} · ${r.cost}积分</div>
            </div>
            <button class="redeem-btn" onclick="cancelRedeem(${w},'${r.id}')" 
              style="background:var(--light-orange);color:var(--orange);font-size:11px;padding:6px 10px;border:1px solid var(--orange)">
              退回积分</button>
          </div>`;
        }
      }
    });
  }
  if (hasRedeemed) {
    html += `<div class="card"><div class="card-title" style="color:var(--orange)">📋 已兑换记录 <span style="font-size:12px;font-weight:400;color:#999">（可取消退回积分）</span></div>${redeemedHtml}</div>`;
  }

  // Summary
  html += `<div class="card">
    <div class="card-title" style="color:var(--blue)">📊 本周统计</div>
    <div class="summary-row"><span class="s-label">🏅 得分合计</span><span class="s-value positive">+${earned}</span></div>
    <div class="summary-row"><span class="s-label">⚠️ 扣分合计</span><span class="s-value negative">${deducted > 0 ? '-'+deducted : '0'}</span></div>
    <div class="summary-row"><span class="s-label">🎁 已兑换</span><span class="s-value negative">${redeemed > 0 ? '-'+redeemed : '0'}</span></div>
    <div class="summary-row" style="border-top:2px solid var(--blue);padding-top:12px"><span class="s-label">💰 本周结余</span><span class="s-value neutral" style="font-size:24px">${balance}</span></div>
  </div>`;

  document.getElementById('content').innerHTML = html;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function fireConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#FFD700','#FF6B6B','#4ECDC4','#7030A0','#70AD47','#ED7D31'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

function confirmReset() {
  if (!checkUnlocked()) return;
  if (confirm('确定要重置所有数据吗？这将清除所有打卡记录和兑换记录。')) {
    if (confirm('再次确认：真的要全部清零吗？')) {
      data = initData();
      saveData();
      currentWeek = 0;
      render();
      showToast('🔄 数据已重置');
    }
  }
}

// ===== CUSTOM ITEMS CONFIG PANEL =====
const EMOJI_PRESETS = [
  '🎨','🎵','🏀','⚽','🚴','🎮','📚','✍️',
  '🧹','🛏️','🚀','🌟','💪','🧘','🍳','🌳',
  '🎯','🧩','🔬','🎹','🐶','🚗','✈️','🌈',
  '😤','😭','😡','😵','🤯','😴','📱','📺'
];

let configDraft = { scores: [], deductions: [] };
let configFormMode = null; // null | 'add-score' | 'edit-score' | 'add-deduction' | 'edit-deduction'
let configFormEditIndex = -1;

function openConfigPanel() {
  if (!checkUnlocked()) return;
  // Deep copy current customItems as draft
  configDraft = JSON.parse(JSON.stringify(data.customItems || { scores: [], deductions: [] }));
  renderConfigPanel();
  document.getElementById('configOverlay').classList.add('show');
  setTimeout(() => document.getElementById('configPanel').classList.add('show'), 50);
}

function closeConfigPanel() {
  document.getElementById('configPanel').classList.remove('show');
  setTimeout(() => document.getElementById('configOverlay').classList.remove('show'), 350);
}

function saveConfigPanel() {
  // Apply draft to data
  data.customItems = JSON.parse(JSON.stringify(configDraft));
  // Ensure all weeks have data for new custom items
  data = ensureWeeks(data);
  saveData();
  closeConfigPanel();
  render();
  showToast('✅ 自定义项目已保存');
}

function renderConfigPanel() {
  let html = '';
  
  // Custom Score Items Section
  html += '<div class="config-section"><h4 style="color:var(--green)">🏆 自定义得分项</h4>';
  if (configDraft.scores.length === 0) {
    html += '<div class="config-empty">还没有自定义得分项</div>';
  } else {
    configDraft.scores.forEach((item, idx) => {
      html += `<div class="config-item-row">
        <div class="ci-icon">${item.icon}</div>
        <div class="ci-info">
          <div class="ci-name">${item.name}</div>
          <div class="ci-rule">${item.rule}</div>
        </div>
        <div class="ci-actions">
          <button class="ci-edit" onclick="editConfigItem('score',${idx})">✏️</button>
          <button class="ci-delete" onclick="deleteConfigItem('score',${idx})">🗑️</button>
        </div>
      </div>`;
    });
  }
  html += '<button class="config-add-btn" onclick="addConfigItem(\'score\')">\u2795 添加得分项</button>';
  html += '</div>';

  // Custom Deduction Items Section
  html += '<div class="config-section"><h4 style="color:var(--orange)">⚠️ 自定义扣分项</h4>';
  if (configDraft.deductions.length === 0) {
    html += '<div class="config-empty">还没有自定义扣分项</div>';
  } else {
    configDraft.deductions.forEach((item, idx) => {
      html += `<div class="config-item-row">
        <div class="ci-icon">${item.icon}</div>
        <div class="ci-info">
          <div class="ci-name">${item.name}</div>
          <div class="ci-rule">${item.rule}</div>
        </div>
        <div class="ci-actions">
          <button class="ci-edit" onclick="editConfigItem('deduction',${idx})">✏️</button>
          <button class="ci-delete" onclick="deleteConfigItem('deduction',${idx})">🗑️</button>
        </div>
      </div>`;
    });
  }
  html += '<button class="config-add-btn" onclick="addConfigItem(\'deduction\')">\u2795 添加扣分项</button>';
  html += '</div>';

  document.getElementById('configPanelBody').innerHTML = html;
}

function addConfigItem(kind) {
  configFormMode = 'add-' + kind;
  configFormEditIndex = -1;
  showConfigForm(kind, null);
}

function editConfigItem(kind, idx) {
  configFormMode = 'edit-' + kind;
  configFormEditIndex = idx;
  const list = kind === 'score' ? configDraft.scores : configDraft.deductions;
  showConfigForm(kind, list[idx]);
}

function deleteConfigItem(kind, idx) {
  const list = kind === 'score' ? configDraft.scores : configDraft.deductions;
  const item = list[idx];
  if (confirm(`确定删除「${item.icon} ${item.name}」吗？`)) {
    list.splice(idx, 1);
    renderConfigPanel();
  }
}

function showConfigForm(kind, existingItem) {
  const isDeduction = kind === 'deduction';
  const title = existingItem 
    ? (isDeduction ? '✏️ 编辑扣分项' : '✏️ 编辑得分项')
    : (isDeduction ? '➕ 添加扣分项' : '➕ 添加得分项');
  const selectedEmoji = existingItem ? existingItem.icon : '';
  const selectedType = existingItem ? existingItem.type : 'streak';
  const selectedPts = existingItem && existingItem.pts ? existingItem.pts : 2;
  const selectedName = existingItem ? existingItem.name : '';

  let html = `<h4>${title}</h4>`;
  
  // Name
  html += `<div class="form-group"><label>📝 名称</label>
    <input type="text" id="cfgName" value="${selectedName}" placeholder="例如：画画、发脾气" maxlength="20"></div>`;

  // Emoji
  html += '<div class="form-group"><label>🎭 图标</label><div class="emoji-grid">';
  EMOJI_PRESETS.forEach(em => {
    html += `<button type="button" class="emoji-option ${em === selectedEmoji ? 'selected' : ''}" 
      onclick="selectEmoji(this,'${em}')">${em}</button>`;
  });
  html += '</div>';
  html += `<div class="emoji-custom-input">
    <input type="text" id="cfgCustomEmoji" placeholder="自定义" maxlength="2" value="${EMOJI_PRESETS.includes(selectedEmoji) ? '' : selectedEmoji}">
    <button type="button" style="padding:8px 12px;border:2px solid #e0e0e0;border-radius:10px;background:white;font-size:13px;cursor:pointer" 
      onclick="applyCustomEmoji()">确定</button>
  </div></div>`;

  // Type
  html += `<div class="form-group"><label>📋 计分类型</label>
    <div class="type-selector">
      <div class="type-option ${selectedType === 'streak' ? 'selected' : ''}" onclick="selectType('streak')" id="typeStreak">
        <div class="to-label">🔥 逐天递加</div>
        <div class="to-desc">每周从1开始，连续第N天${isDeduction ? '扣' : '得'}N分</div>
      </div>
      <div class="type-option ${selectedType === 'counter' ? 'selected' : ''}" onclick="selectType('counter')" id="typeCounter">
        <div class="to-label">📊 固定${isDeduction ? '扣分' : '加分'}</div>
        <div class="to-desc">每次固定${isDeduction ? '扣' : '得'}分</div>
      </div>
    </div></div>`;

  // Points (counter only)
  html += `<div class="form-group" id="cfgPtsGroup" style="${selectedType === 'counter' ? '' : 'display:none'}">
    <label>🎯 每次${isDeduction ? '扣' : '得'}分</label>
    <input type="number" id="cfgPts" min="1" max="100" value="${selectedPts}" placeholder="2"></div>`;

  // Actions
  html += `<div class="form-actions">
    <button class="fa-cancel" onclick="closeConfigForm()">取消</button>
    <button class="fa-save" onclick="saveConfigForm()">确认</button>
  </div>`;

  document.getElementById('configForm').innerHTML = html;
  document.getElementById('configFormOverlay').classList.add('show');
}

let _selectedEmoji = '';
let _selectedType = 'streak';

function selectEmoji(btn, emoji) {
  document.querySelectorAll('.emoji-option').forEach(el => el.classList.remove('selected'));
  btn.classList.add('selected');
  _selectedEmoji = emoji;
  document.getElementById('cfgCustomEmoji').value = '';
}

function applyCustomEmoji() {
  const v = document.getElementById('cfgCustomEmoji').value.trim();
  if (v) {
    document.querySelectorAll('.emoji-option').forEach(el => el.classList.remove('selected'));
    _selectedEmoji = v;
    showToast(`图标已选择：${v}`);
  }
}

function selectType(type) {
  _selectedType = type;
  document.getElementById('typeStreak').className = 'type-option' + (type === 'streak' ? ' selected' : '');
  document.getElementById('typeCounter').className = 'type-option' + (type === 'counter' ? ' selected' : '');
  document.getElementById('cfgPtsGroup').style.display = type === 'counter' ? '' : 'none';
}

function closeConfigForm() {
  document.getElementById('configFormOverlay').classList.remove('show');
}

function saveConfigForm() {
  const name = document.getElementById('cfgName').value.trim();
  if (!name) { showToast('请输入名称'); return; }
  
  // Determine emoji: from selection or from custom input
  let emoji = _selectedEmoji;
  const customEmoji = document.getElementById('cfgCustomEmoji').value.trim();
  if (customEmoji) emoji = customEmoji;
  // If still empty, check if there's a selected .emoji-option
  if (!emoji) {
    const sel = document.querySelector('.emoji-option.selected');
    if (sel) emoji = sel.textContent;
  }
  if (!emoji) { showToast('请选择图标'); return; }

  // Get type from DOM state
  const type = document.getElementById('typeStreak').classList.contains('selected') ? 'streak' : 'counter';
  const pts = type === 'counter' ? Math.max(1, parseInt(document.getElementById('cfgPts').value) || 2) : 0;

  const isDeduction = configFormMode.includes('deduction');
  const isEdit = configFormMode.startsWith('edit');
  const list = isDeduction ? configDraft.deductions : configDraft.scores;

  // Generate rule text
  let rule;
  if (type === 'streak') {
    rule = isDeduction ? '逐天递加：每周从1开始，连续第N天扣N分' : '逐天递加：每周从1开始，连续第N天得N分';
  } else {
    rule = isDeduction ? `每次 -${pts}分` : `每次 +${pts}分`;
  }

  if (isEdit && configFormEditIndex >= 0 && configFormEditIndex < list.length) {
    // Edit existing: keep same id
    const item = list[configFormEditIndex];
    item.icon = emoji;
    item.name = name;
    item.rule = rule;
    item.type = type;
    item.pts = pts;
  } else {
    // Add new: generate unique id
    const prefix = isDeduction ? 'custom_d' : 'custom_';
    const allIds = [...configDraft.scores, ...configDraft.deductions].map(i => i.id);
    let counter = 1;
    while (allIds.includes(prefix + counter)) counter++;
    list.push({
      id: prefix + counter,
      icon: emoji,
      name: name,
      rule: rule,
      type: type,
      pts: pts
    });
  }

  closeConfigForm();
  renderConfigPanel();
}

// Initialize emoji/type state when form opens
const origShowConfigForm = showConfigForm;
showConfigForm = function(kind, existingItem) {
  _selectedEmoji = existingItem ? existingItem.icon : '';
  _selectedType = existingItem ? existingItem.type : 'streak';
  origShowConfigForm(kind, existingItem);
};

// Prevent config form overlay click from closing (only close via button)
document.getElementById('configFormOverlay').addEventListener('click', function(e) {
  if (e.target === document.getElementById('configFormOverlay')) {
    closeConfigForm();
  }
});

render();

// 启动云端同步
initCloudSync();

// 每次页面可见时，从云端拉取最新数据（处理多设备切换）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    cloudLoad().then(cloudData => {
      if (cloudData && cloudData.weeks && cloudData.weeks.length > 0) {
        data = ensureWeeks(cloudData);
        localStorage.setItem('reward_chart_v2', JSON.stringify(data));
        render();
        updateSyncIndicator();
      }
    });
  }
});
</script>
</body>
</html>
